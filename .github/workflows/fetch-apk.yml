name: Fetch APK
on:
  push:
    branches: [ "arena/01a0d735-makrotv" ]
    paths: [ ".github/workflows/fetch-apk.yml" ]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0d735-makrotv
          fetch-depth: 0
      - name: Extract all f.j.a.f
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq unzip wget > /dev/null
          wget -q https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip -O jadx.zip
          unzip -q jadx.zip -d jadx
          ./jadx/bin/jadx -d /tmp/jadx makrotv.apk --no-imports 2>&1 | head -n 20 || true
          mkdir -p analysis/full_f
          cp -r /tmp/jadx/sources/f/j/a/f analysis/full_f/ || true
          ls -R analysis/full_f 2>&1 | head -n 100
          for f in analysis/full_f/f/*; do echo "=== $f ==="; cat "$f" 2>&1 | head -n 500; done > analysis/full_f_dump.txt
          cat /tmp/jadx/sources/f/j/a/f/*.java 2>&1 | head -n 5000 > analysis/full_f_dump2.txt
          ls -lh analysis/*.txt
          # Also extract interfaces that define API endpoints
          find /tmp/jadx -name "*.java" | xargs grep -l "dns\|@GET\|@POST" 2>/dev/null | head -n 20
          for f in $(find /tmp/jadx -name "*.java" | xargs grep -l "@GET\|@POST" 2>/dev/null | head -n 10); do echo "==== API $f ===="; cat "$f"; echo; done > analysis/api_interfaces.txt
          cat analysis/api_interfaces.txt 2>&1 | head -n 2000
          # Check strings for login
          grep -R "f10105o\|f10100j" /tmp/jadx/sources --include="*.java" -n | head -n 100 > analysis/consts.txt || true
          cat analysis/consts.txt | head -n 100
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis/full_f_dump.txt analysis/full_f_dump2.txt analysis/api_interfaces.txt analysis/consts.txt analysis/full_f || true
          git status
          git commit -m "Add full f.j.a.f dump" || echo "nothing to commit"
          git push origin arena/01a0d735-makrotv
