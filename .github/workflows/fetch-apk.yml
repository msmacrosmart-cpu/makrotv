name: Fetch APK
on:
  push:
    branches: [ "arena/01a0d735-makrotv" ]
    paths: [ ".github/workflows/fetch-apk.yml" ]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0d735-makrotv
          fetch-depth: 0
      - name: Extract key source
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip wget > /dev/null
          wget -q https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip -O jadx.zip
          unzip -q jadx.zip -d jadx
          ./jadx/bin/jadx -d /tmp/jadx makrotv.apk --no-imports 2>&1 | head -n 50 || true
          mkdir -p analysis/keyfiles
          # Find and copy key files
          find /tmp/jadx -type f -name "*.java" | xargs grep -l "appstop\|BASE_URL" 2>/dev/null | head -n 20
          for f in $(find /tmp/jadx -type f -name "*.java" | xargs grep -l "appstop\|BASE_URL\|ApiService\|Retrofit" 2>/dev/null | head -n 30); do
            rel=$(echo "$f" | sed 's|/tmp/jadx/||')
            mkdir -p "analysis/keyfiles/$(dirname "$rel")"
            cp "$f" "analysis/keyfiles/$rel"
            echo "Copied $rel"
          done
          # Also get LoginActivity
          find /tmp/jadx -path "*LoginActivity.java" | head -n 5
          for f in $(find /tmp/jadx -path "*LoginActivity.java" | head -n 5); do
            rel=$(echo "$f" | sed 's|/tmp/jadx/||')
            mkdir -p "analysis/keyfiles/$(dirname "$rel")"
            cp "$f" "analysis/keyfiles/$rel"
            echo "LoginActivity $rel"
          done
          # Also get any file that contains http://appstop
          find /tmp/jadx -name "*.java" -exec grep -l "http" {} \; | head -n 20
          ls -R analysis/keyfiles 2>&1 | head -n 500
          # Dump one key file
          cat analysis/keyfiles/sources/f/j/a/f/g.java 2>&1 | head -n 200 || true
          cat /tmp/jadx/sources/f/j/a/f/g.java 2>&1 | head -n 500 || true
          # Also try to find SharedPreferences keys
          grep -R "SharedPreferences\|getString.*url\|loginPrefs" /tmp/jadx/sources --include="*.java" -n | head -n 100 > analysis/shared_prefs.txt || true
          cat analysis/shared_prefs.txt | head -n 100
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis/keyfiles analysis/shared_prefs.txt || true
          git status
          git commit -m "Add key decompiled files" || echo "nothing to commit"
          git push origin arena/01a0d735-makrotv
