name: Fetch APK
on:
  workflow_dispatch:
  push:
    branches: [ "arena/01a0d735-makrotv" ]
    paths: [ ".github/workflows/fetch-apk.yml" ]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0d735-makrotv
          fetch-depth: 0
      - name: Download APK
        run: |
          set -e
          URL="https://files.catbox.moe/rq155y.apk"
          echo "Downloading $URL"
          curl -L -o makrotv.apk "$URL" --fail --progress-bar
          ls -lh makrotv.apk
          file makrotv.apk || true
          # Also try to get info
          du -h makrotv.apk
          # Keep a copy in apk folder
          mkdir -p apk
          cp makrotv.apk apk/makrotv.apk
          # Also save short link redirect info
          curl -L -I "https://bit.ly/makrotvfinalv7" || true
      - name: Commit APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add makrotv.apk apk/makrotv.apk || git add -f makrotv.apk
          git commit -m "Add MakroTV APK (63MB) from catbox" || echo "nothing to commit"
          git push origin arena/01a0d735-makrotv
