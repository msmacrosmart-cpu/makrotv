name: Fetch APK
on:
  push:
    branches: [ "arena/01a0d735-makrotv" ]
    paths: [ ".github/workflows/fetch-apk.yml" ]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0d735-makrotv
          fetch-depth: 0
      - name: Extract critical sources
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq unzip wget > /dev/null
          wget -q https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip -O /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx -d /tmp/jadx_out makrotv.apk --no-imports 2>&1 | head -n 20
          mkdir -p analysis/critical
          # Copy relevant packages
          for pkg in "f/j/a/h/i" "f/j/a/f" "f/j/a/j" "f/j/a/h"; do
            if [ -d "/tmp/jadx_out/sources/$pkg" ]; then
              mkdir -p "analysis/critical/$pkg"
              cp -r "/tmp/jadx_out/sources/$pkg"/* "analysis/critical/$pkg"/ || true
            fi
          done
          # Also copy entire LoginActivity and Splash
          cp /tmp/jadx_out/sources/boxbr/apksrebrand/smarters/view/activity/LoginActivity.java analysis/critical/ 2>&1 | head -n 20 || true
          cp /tmp/jadx_out/sources/boxbr/apksrebrand/smarters/view/activity/SplashActivity.java analysis/critical/ 2>&1 | head -n 20 || true
          # Dump Retrofit interfaces
          find /tmp/jadx_out/sources -name "*.java" | xargs grep -l "interface.*{" | xargs grep -l "@GET\|@POST" 2>/dev/null | head -n 20
          mkdir -p analysis/retrofit
          for f in $(find /tmp/jadx_out/sources -name "*.java" | xargs grep -l "@GET\|@POST" 2>/dev/null | head -n 20); do
            echo "Found $f"
            rel=$(echo "$f" | sed 's|/tmp/jadx_out/sources/||')
            mkdir -p "analysis/retrofit/$(dirname "$rel")"
            cp "$f" "analysis/retrofit/$rel"
          done
          ls -R analysis/critical 2>&1 | head -n 200
          ls -R analysis/retrofit 2>&1 | head -n 200
          # Show key file: f.java
          echo "=== f.java ===" > analysis/critical_dump.txt
          cat /tmp/jadx_out/sources/f/j/a/f/f.java >> analysis/critical_dump.txt
          echo "=== g.java ===" >> analysis/critical_dump.txt
          cat /tmp/jadx_out/sources/f/j/a/f/g.java >> analysis/critical_dump.txt
          echo "=== h/i/a.java ===" >> analysis/critical_dump.txt
          cat /tmp/jadx_out/sources/f/j/a/h/i/a.java >> analysis/critical_dump.txt | head -n 500
          cat analysis/critical_dump.txt | head -n 1000
          # Also dump j/c.java which seems to handle dns fetching
          echo "=== j/c.java ===" > analysis/j_c.txt
          cat /tmp/jadx_out/sources/f/j/a/j/c.java >> analysis/j_c.txt
          cat analysis/j_c.txt | head -n 500
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis/critical analysis/retrofit analysis/critical_dump.txt analysis/j_c.txt || true
          git status
          git commit -m "Add critical sources" || echo "nothing to commit"
          git push origin arena/01a0d735-makrotv
