name: Patch APK

on:
  workflow_dispatch:
    inputs:
      panel_url:
        description: "URL base do painel (ex: https://makrotv.vercel.app)"
        required: false
        default: "https://makrotv.vercel.app"
  push:
    branches: ["arena/01a0d775-makrotv"]
    paths:
      - "scripts/patch-apk.sh"
      - ".github/workflows/patch-apk.yml"
      - "makrotv.apk"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install apktool and Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # Debian/Ubuntu packages provide the same tools used by the successful
          # rebuild workflow; do not fall back to jarsigner because v2/v3 are required.
          sudo apt-get install -y -qq apktool unzip zip 2>&1 | tail -n 30 || true
          sudo apt-get install -y -qq zipalign apksigner 2>&1 | tail -n 30 || true
          if ! command -v apktool >/dev/null 2>&1; then
            curl -fsSL https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -o /tmp/apktool
            curl -fsSL https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -o /tmp/apktool.jar
            sudo install -m 0755 /tmp/apktool /usr/local/bin/apktool
            sudo install -m 0644 /tmp/apktool.jar /usr/local/bin/apktool.jar
          fi
          for sdk in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk /opt/android-sdk; do
            if [ -d "$sdk" ]; then
              for build_tools in "$sdk"/build-tools/*; do
                [ -d "$build_tools" ] && export PATH="$build_tools:$PATH"
              done
            fi
          done
          echo "$PATH" >> "$GITHUB_PATH"
          command -v apktool
          command -v zipalign
          command -v apksigner
          apktool --version
          apksigner version

      - name: Rebuild, align and sign APK
        env:
          PANEL_URL: ${{ github.event.inputs.panel_url || 'https://makrotv.vercel.app' }}
        run: |
          set -euo pipefail
          chmod +x scripts/patch-apk.sh
          ./scripts/patch-apk.sh "$PANEL_URL"
          test -s apk-patched/makrotv-patched.apk
          echo "APK bytes: $(stat -c '%s' apk-patched/makrotv-patched.apk)"
          unzip -p apk-patched/makrotv-patched.apk classes.dex | strings | grep -F "makrotv.vercel.app"
          if unzip -p apk-patched/makrotv-patched.apk classes.dex | strings | grep -Fq "appstop.site"; then
            echo "old panel URL still present" >&2
            exit 1
          fi

      - name: Copy APK to Vercel public directory
        run: |
          cp -f apk-patched/makrotv-patched.apk public/makrotv-patched.apk
          ls -lh apk-patched/makrotv-patched.apk public/makrotv-patched.apk

      - name: Commit patched APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/makrotv-patched.apk apk-patched/makrotv-patched.apk
          if git diff --cached --quiet; then
            echo "APK não mudou"
            exit 0
          fi
          git commit -m "fix(apk): rebuild aligned and v1/v2/v3 signed APK"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: makrotv-patched
          path: apk-patched/makrotv-patched.apk
          if-no-files-found: error
