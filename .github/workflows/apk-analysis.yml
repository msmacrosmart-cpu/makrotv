name: APK Analysis
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0d735-makrotv
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y unzip wget python3 lynx
          # download jadx
          wget -q https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip -O jadx.zip
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx jadx/bin/jadx-gui
          # also download apktool
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O apktool
          wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O apktool.jar
          chmod +x apktool apktool.jar
      - name: Analyze APK
        run: |
          set -e
          ls -lh makrotv.apk
          mkdir -p analysis
          # Try jadx
          ./jadx/bin/jadx -d analysis/jadx makrotv.apk || echo "jadx failed"
          # Try apktool
          java -jar apktool.jar d makrotv.apk -o analysis/apktool || echo "apktool failed"
          # Grep for interesting strings
          echo "=== GREP appstop ===" > analysis/report.txt
          grep -r "appstop" analysis --include="*.java" --include="*.xml" --include="*.smali" -n | head -n 200 >> analysis/report.txt || echo "no appstop grep" >> analysis/report.txt
          echo "=== GREP base url ===" >> analysis/report.txt
          grep -R "BASE_URL\|baseUrl\|server_url\|SERVER\|DNS" analysis --include="*.java" -n | head -n 300 >> analysis/report.txt || true
          echo "=== GREP 135.148 ===" >> analysis/report.txt
          grep -R "135.148\|51.75" analysis --include="*.java" -n | head -n 100 >> analysis/report.txt || true
          echo "=== Package list ===" >> analysis/report.txt
          ls -R analysis/jadx | head -n 500 >> analysis/report.txt || true
          echo "=== Manifest ===" >> analysis/report.txt
          cat analysis/apktool/AndroidManifest.xml 2>&1 | head -n 500 >> analysis/report.txt || true
          # Also plain strings
          strings makrotv.apk | grep -E "http" | head -n 100 >> analysis/report.txt || true
          # Save report
          cat analysis/report.txt
      - name: Commit analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis/report.txt || true
          git add analysis/jadx 2>&1 | head -n 20 || true
          # Only commit report to avoid huge diff
          git add analysis || true
          git status
          git commit -m "APK analysis report" || echo "nothing to commit"
          git push origin arena/01a0d735-makrotv || echo "push failed"
